# Perfil dev: SOMENTE DESENVOLVIMENTO. Sobe com o docker-compose.dev.yml (Postgres e WireMock).
# Nenhum valor daqui é de produção: senha, tokens e o par de chaves JWT são falsos e públicos.

# Postgres do docker-compose.dev.yml
spring.datasource.url=jdbc:postgresql://localhost:5432/upa
spring.datasource.username=upa
spring.datasource.password=upa

# Canais no WireMock do compose (stubs em config/dev/wiremock/mappings); tokens falsos.
upa.canais.sms.base-url=http://localhost:8089
upa.canais.sms.token=token-falso-de-dev
upa.canais.email.base-url=http://localhost:8089
upa.canais.email.token=token-falso-de-dev

# JWT com o par de chaves de dev (config/dev/jwt). Produção exige UPA_SEGURANCA_JWT_CHAVE_PUBLICA.
upa.seguranca.jwt.chave-publica=file:config/dev/jwt/publica.pem
upa.seguranca.jwt.emissor=http://localhost:8080/dev
upa.seguranca.jwt.audiencia=upa-api
# Só o POST /dev/token usa a chave privada, e só neste perfil.
upa.dev.jwt.chave-privada=file:config/dev/jwt/privada.pem

# O agendador do outbox roda: os avisos saem sozinhos depois do PATCH.
upa.outbox.habilitado=true

# Swagger e detalhes do health só aqui.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
management.endpoint.health.show-details=always
