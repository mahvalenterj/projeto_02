spring.application.name=upa
spring.threads.virtual.enabled=true
management.endpoint.health.show-details=never

# O Flyway cria o schema; o Hibernate só valida. Conexão por variável de ambiente
# (SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Resiliência dos canais de aviso (spec 001 §10); valores iniciais a calibrar.
# base-url e token de cada canal NÃO têm valor padrão: vêm só do ambiente
# (UPA_CANAIS_SMS_BASE_URL, UPA_CANAIS_SMS_TOKEN, UPA_CANAIS_EMAIL_BASE_URL, UPA_CANAIS_EMAIL_TOKEN).
upa.canais.sms.timeout-conexao=PT2S
upa.canais.sms.timeout-leitura=PT5S
upa.canais.sms.retry.tentativas=3
upa.canais.sms.retry.espera-inicial=PT0.5S
upa.canais.sms.retry.multiplicador=2
upa.canais.sms.retry.jitter=0.5
upa.canais.sms.retry.retry-after-maximo=PT5S
upa.canais.sms.breaker.janela=50
upa.canais.sms.breaker.minimo-de-chamadas=20
upa.canais.sms.breaker.taxa-de-falha=50
upa.canais.sms.breaker.tempo-aberto=PT30S
upa.canais.sms.limitador.limite=50
upa.canais.sms.limitador.periodo=PT1S
upa.canais.sms.limitador.espera=PT5S
upa.canais.sms.bulkhead.maximo=50
upa.canais.sms.bulkhead.espera=PT5S

upa.canais.email.timeout-conexao=PT3S
upa.canais.email.timeout-leitura=PT10S
upa.canais.email.retry.tentativas=2
upa.canais.email.retry.espera-inicial=PT1S
upa.canais.email.retry.multiplicador=2
upa.canais.email.retry.jitter=0.5
upa.canais.email.retry.retry-after-maximo=PT5S
upa.canais.email.breaker.janela=20
upa.canais.email.breaker.minimo-de-chamadas=10
upa.canais.email.breaker.taxa-de-falha=50
upa.canais.email.breaker.tempo-aberto=PT30S
upa.canais.email.limitador.limite=50
upa.canais.email.limitador.periodo=PT1S
upa.canais.email.limitador.espera=PT5S
upa.canais.email.bulkhead.maximo=50
upa.canais.email.bulkhead.espera=PT5S

# Lote de avisos (spec 001 §10): tempo-limite da reserva e concorrência do lote.
# Concorrência calibrada pela carga (fatia 9): 15 envios simultâneos mantêm cerca de 50/s com o
# limitador de 50/s sem enfileirar as chamadas dentro do adapter (com 50, o p99 passava de 2 s).
upa.aviso.tempo-limite-reserva=PT120S
upa.aviso.concorrencia-maxima=15

# Despachante do outbox. O lease cobre o lote de UM evento: a carga (fatia 9) mediu 97 a 112 s para
# 5.000 avisos; 5 min dá folga de cerca de 2,7 vezes e é o tempo máximo até outra réplica assumir
# um evento cujo processo caiu. O atraso de reentrega (130 s) fica acima do tempo-limite da
# reserva (120 s).
upa.outbox.habilitado=true
upa.outbox.tamanho-do-lote=10
upa.outbox.lease=PT5M
upa.outbox.atraso-de-reentrega=PT130S
upa.outbox.maximo-de-tentativas=5
upa.outbox.intervalo=PT2S

# Segurança da API (ADR 0004): JWT RS256 validado com a chave PÚBLICA. Sem valor padrão: sem as
# variáveis de ambiente a aplicação não sobe (falha fechada). A chave é o PEM X.509
# ("-----BEGIN PUBLIC KEY-----..."); o perfil dev aponta para config/dev/jwt/publica.pem.
upa.seguranca.jwt.chave-publica=${UPA_SEGURANCA_JWT_CHAVE_PUBLICA}
upa.seguranca.jwt.emissor=${UPA_SEGURANCA_JWT_EMISSOR}
upa.seguranca.jwt.audiencia=${UPA_SEGURANCA_JWT_AUDIENCIA}

# Swagger desligado por padrão; só o perfil dev liga (application-dev.properties).
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
